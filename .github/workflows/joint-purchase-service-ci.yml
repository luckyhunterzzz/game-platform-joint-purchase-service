name: Joint Purchase Service CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: joint_purchase_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: supersecret_pass_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin -d joint_purchase_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      mongodb:
        image: mongo:8.0
        env:
          MONGO_INITDB_ROOT_USERNAME: mongo_admin
          MONGO_INITDB_ROOT_PASSWORD: mongo_secret_123
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --username mongo_admin --password mongo_secret_123 --authenticationDatabase admin --eval \"db.adminCommand('ping')\""
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      kafka:
        image: apache/kafka:3.9.2
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        options: >-
          --health-cmd="/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Gradle tests
        run: ./gradlew test --no-daemon

  migration-check:
    name: Check Flyway Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: joint_purchase_db
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: supersecret_pass_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U admin -d joint_purchase_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Apply and validate Flyway migrations
        run: >
          ./gradlew --no-daemon
          -Dflyway.url=jdbc:postgresql://localhost:5432/joint_purchase_db
          -Dflyway.user=admin
          -Dflyway.password=supersecret_pass_123
          -Dflyway.locations=filesystem:src/main/resources/db/migration
          flywayMigrate flywayValidate

  docker-publish:
    name: Publish Docker Image
    runs-on: ubuntu-latest
    needs:
      - test
      - migration-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: luckyhunterzzz/game-platform-joint-purchase-service
          tags: |
            type=raw,value=main
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
