app:
  kafka:
    topics:
      player-profile-events: player-profile-events
      joint-purchase-events: joint-purchase-events
      trust-score-events: trust-score-events
      notification-events: notification-events
  services:
    player-profile:
      base-url: http://player-profile-service:8083
  minio:
    endpoint: ${APP_MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
    public-base-url: ${APP_MINIO_PUBLIC_BASE_URL:http://minio:9000}
    public-bucket: ${APP_MINIO_PUBLIC_BUCKET:game-content}
    private-bucket: ${APP_MINIO_PRIVATE_BUCKET:user-data}
    secure: false

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/joint_purchase_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI}

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: joint-purchase-group-v3
      auto-offset-reset: earliest

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

management:
  endpoint:
    health:
      show-details: always
