server:
  port: 8085

spring:
  application:
    name: joint-purchase-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false

app:
  kafka:
    topics:
      player-profile-events: player-profile-events
      joint-purchase-events: joint-purchase-events
      trust-score-events: trust-score-events

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] %-5level %logger{36} - %msg%n"