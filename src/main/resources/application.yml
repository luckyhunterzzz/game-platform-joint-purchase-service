server:
  port: 8085

spring:
  application:
    name: joint-purchase-service
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    open-in-view: false

app:
  kafka:
    topics:
      player-profile-events: player-profile-events
      joint-purchase-events: joint-purchase-events
      trust-score-events: trust-score-events
      notification-events: notification-events
  services:
    player-profile:
      base-url: http://localhost:8083
  minio:
    public-base-url: ${APP_MINIO_PUBLIC_BASE_URL:http://localhost:9000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "http.server.requests": true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{requestId}] %-5level %logger{36} - %msg%n"

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:${spring.application.name}@local}
  send-default-pii: false
